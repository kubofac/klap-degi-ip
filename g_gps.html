<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>KLAP DEGI ULTIMATE V2 - PRECISION</title>
    <link rel="manifest" href="/manifest.json">
<style>
    :root { --hrc-red: #E4002B; --hrc-blue: #004098; --hrc-white: #ffffff; --bg-dark: #000000; --hrc-orange: #FFA500; }
    
    body, html {
        margin: 0; padding: 0; width: 100vw; height: 100vh;
        background-color: var(--bg-dark); color: var(--hrc-white);
        font-family: 'Arial Black', sans-serif; overflow: hidden;
        position: fixed; left: 0; top: 0;
    }

    canvas {
        display: block; position: fixed; top: 0; left: 0;
        width: 100vw !important; height: 100vh !important;
        z-index: -1; pointer-events: none;
    }

    .main-ui-container {
        position: absolute; right: 15px; top: 90px; bottom: 50px;
        display: flex; flex-direction: row; align-items: flex-start; gap: 25px; z-index: 20; pointer-events: none;
    }

    /* --- UIベース --- */
    #info-overlay { 
        display: flex; flex-direction: column; align-items: flex-end; text-align: right; 
        height: 100%; justify-content: center; 
    }

    #rpm_val { font-size: 11vh; font-weight: 900; line-height: 0.8; text-shadow: 3px 3px 10px #000; margin-bottom: 15px; }
    #display1 { font-size: 17vh; letter-spacing: 1px; transform: scaleX(0.95); transform-origin: right; font-weight: 900; line-height: 0.8; color: var(--hrc-white); text-shadow: 4px 4px 15px #000; white-space: nowrap; display: inline-block; }
    #display { font-size: 3.5vh; color: #bbb; text-shadow: 1px 1px 6px #000; margin-top: 5px; }

    #lap-panel { width: 140px; height: 100%; display: flex; flex-direction: column; border-top: none; overflow: hidden; padding-top: 30px; }
    #lap { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    #lap::-webkit-scrollbar { display: none; }
    .lap-row { display: flex; justify-content: flex-end; gap: 15px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 16px; font-weight: 900; }
    .best-lap { color: var(--hrc-red) !important; }

    .data-panel { display: flex; flex-direction: column; gap: 12px; width: 90px; padding-top: 30px; }
    .data-box { display: flex; flex-direction: column; align-items: flex-end; }
    .label { font-size: 10px; color: var(--hrc-red); font-weight: bold; }
    .val { font-size: 32px; font-weight: 900; line-height: 0.9; }

    footer { height: 45px; display: flex; gap: 4px; padding: 3px; background: #000; border-top: 1px solid #333; z-index: 100; position: fixed; bottom: 0; left: 0; right: 0; padding-bottom: env(safe-area-inset-bottom); }
    button { flex: 1; background: #1a1a1a; color: #fff; border: 1px solid #444; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; height: 100%; pointer-events: auto; }

    /* --- iPhone 8 専用レイアウト --- */
    @media screen and (max-width: 667px) and (orientation: landscape) {
        .main-ui-container { position: absolute !important; top: 0; left: 0; right: 0; bottom: 0 !important; width: 100% !important; height: 100% !important; pointer-events: none !important; }
        .data-panel { position: absolute !important; right: 12px !important; top: 65px !important; width: 80px !important; display: flex !important; flex-direction: column !important; gap: 4px !important; pointer-events: auto !important; }
        #lap-panel { position: absolute !important; right: 110px !important; top: 65px !important; bottom: 35px !important; width: 115px !important; border: 0px none transparent !important; background: none !important; display: flex !important; flex-direction: column !important; pointer-events: auto !important; }
        .lap-row { display: flex !important; justify-content: space-between !important; border-top: 1px solid rgba(255,255,255,0.1) !important; padding: 4px 0 !important; font-size: 13px !important; }
        #info-overlay { position: absolute !important; right: 255px !important; top: 20px !important; display: flex !important; flex-direction: column !important; align-items: flex-end !important; pointer-events: auto !important; }
        #display { font-size: 3.5vh !important; margin-bottom: -5px !important; }
        #rpm_val { font-size: 9vh !important; line-height: 0.9 !important; margin-bottom: 10px !important; }
        #display1 { font-size: 18vh !important; line-height: 0.8 !important; text-shadow: 2px 2px 8px #000 !important; margin-top: 0 !important; }
    }

    /* --- AQUOS / 大画面補正 --- */
    @media screen and (min-width: 400px) and (orientation: landscape) {
        #display1, #rpm_val { transform: scaleX(1.0) !important; }
        .val { font-size: 42px !important; } 
        .label { font-size: 14px !important; } 
        .lap-row { font-size: 20px !important; gap: 20px !important; } 
        #lap-panel { width: 155px !important; } 
        #info-overlay { right: 295px !important; }
        .data-panel { width: 110px !important; }
    }
</style>
</head>
<body>

<div id="dashboard">
 <canvas id="canvas"></canvas>
    <div class="main-ui-container">
        <div id="info-overlay">
            <div id="rpm_val">0</div>
            <div id="display1">00:00.000</div>
            <div id="display">TOTAL 00:00.000</div>
        </div>
        <div id="lap-panel"><div id="lap"></div></div>
        <div class="data-panel">
            <div class="data-box"><div class="label">SPEED</div><div class="val" id="speed_val">0</div></div>
            <div class="data-box"><div class="label">MAX</div><div class="val" id="max_speed_val" style="color:var(--hrc-orange);">0</div></div>
            <div class="data-box"><div class="label">TEMP</div><div class="val" id="temp_val">--</div></div>
        </div>
    </div>
    <footer>
        <button id="intGpsBtn">INT GPS</button>
        <button id="btConnect">BLE START</button>
        <button id="startBtn">TIMER</button>
        <button id="lapBtn">LAP/RESET</button>
        <button id="saveLogBtn" style="display:none; background:var(--hrc-orange); color:#000;">LOG SAVE</button>
        <button id="reloadBtn">RELOAD</button>
    </footer>
</div>

<script>
'use strict';
// --- 1. 定数・変数定義 ---
const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
const PULSE_UUID = "f4deb353-a4cf-4ffb-badb-2a5f2e3bb630";

let currentRPM = 0, currentTemp = 0, currentSpeedKmh = 0, maxSpeed = 0;
let lastPos = null, lastLapTime = 0, pulseCount = 1;
let LAP_LINE_P1 = { lat: 0, lon: 0 }, LAP_LINE_P2 = { lat: 0, lon: 0 };
let swState = 0, startTime = 0, lapStartTime = 0, lapRecords = [];
let trackLogs = [], currentLapLog = [];
let lastGpsDataTime = 0, lastBleDataTime = 0, watchId = null;
let isFrozen = false, freezeDisplayTime = "", freezeStartTime = 0;
let detectedDirection = null, wakeLock = null;

const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');

// --- 2. 高精度交差判定ロジック (V5.1準拠) ---
function getIntersection(p1, p2, line) {
    if (!line || !line.p1.lat) return null;
    const x1 = p1.lon, y1 = p1.lat, x2 = p2.lon, y2 = p2.lat;
    const x3 = line.p1.lon, y3 = line.p1.lat, x4 = line.p2.lon, y4 = line.p2.lat;

    const den = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1);
    if (Math.abs(den) < 1e-12) return null; 

    const t = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / den;
    const u = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / den;

    if (t >= 0 && t <= 1 && u >= -0.2 && u <= 1.2) {
        return { 
            time: p1.time + (p2.time - p1.time) * t, 
            dir: ((x4 - x3) * (y2 - y1) - (y4 - y3) * (x2 - x1)) > 0 ? 1 : -1 
        };
    }
    return null;
}

// --- 3. 共通判定ロジック (司令塔) ---
function handleUpdate(lat, lon, now) {
    if (swState !== 1) return;

    if (currentSpeedKmh > maxSpeed) maxSpeed = currentSpeedKmh;

    const currentPos = { lat, lon, time: now, rpm: currentRPM, temp: currentTemp, speed: currentSpeedKmh };
    currentLapLog.push(currentPos);

    if (lastPos && LAP_LINE_P1.lat !== 0) {
        const line = { p1: LAP_LINE_P1, p2: LAP_LINE_P2 };
        const hit = getIntersection(lastPos, currentPos, line);

        if (hit) {
            if (detectedDirection === null) detectedDirection = hit.dir;
            const cd = parseFloat(localStorage.getItem('lapCoolDownTime')) || 15000;

            if (hit.dir === detectedDirection && (hit.time - lastLapTime > cd)) {
                processLap(hit.time, true);
            }
        }
    }
    lastPos = currentPos;
}

// --- 4. GPS / BLE 通信 ---
function startInternalGps() {
    if (watchId !== null) return;
    if ("wakeLock" in navigator) {
        navigator.wakeLock.request("screen").then(w => wakeLock = w).catch(()=>{});
    }
    
    watchId = navigator.geolocation.watchPosition(pos => {
        lastGpsDataTime = Date.now();
        currentSpeedKmh = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
        document.getElementById('speed_val').textContent = currentSpeedKmh;
        handleUpdate(pos.coords.latitude, pos.coords.longitude, Date.now());
    }, null, { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 });
}

async function ble() {
    try {
        const device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE_UUID] }] });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        const char = await service.getCharacteristic(PULSE_UUID);
        char.addEventListener('characteristicvaluechanged', (e) => {
            lastBleDataTime = Date.now();
            const d = e.target.value;
            if (d.byteLength >= 13) {
                const lat = d.getInt32(0, true) / 1000000;
                const lon = d.getInt32(4, true) / 1000000;
                currentSpeedKmh = d.getUint16(8, true);
                currentTemp = d.getUint8(10);
                currentRPM = (d.getUint16(11, true) * 60) / pulseCount;
                document.getElementById('temp_val').textContent = currentTemp;
                handleUpdate(lat, lon, Date.now());
            } else if (d.byteLength >= 3) { // 互換性維持
                let hz = d.getUint8(0) | (d.getUint8(1) << 8);
                currentRPM = (hz * 60) / pulseCount;
                currentTemp = d.getUint8(2);
                document.getElementById('temp_val').textContent = currentTemp;
            }
        });
        await char.startNotifications();
        document.getElementById('btConnect').textContent = "BLE FIXED";
    } catch (e) { console.error(e); }
}

// --- 5. ラップ処理・ログ保存 ---
function processLap(exactTime, useFreeze) {
    const lapTime = exactTime - (lapStartTime || startTime);
    if (lapTime <= 0) return;

    lapRecords.unshift(lapTime);
    trackLogs.push([...currentLapLog]);
    currentLapLog = [];
    
    lapStartTime = exactTime; 
    lastLapTime = exactTime;

    const d = document.getElementById('lap'); 
    d.innerHTML = "";
    const best = Math.min(...lapRecords);

    lapRecords.forEach((t, i) => {
        const r = document.createElement('div'); 
        r.className = `lap-row ${t === best ? 'best-lap' : ''}`;
        r.innerHTML = `<span>L${lapRecords.length - i}</span><span>${timeFormat(t)}</span>`;
        d.appendChild(r);
    });

    if (useFreeze) { 
        isFrozen = true; 
        freezeDisplayTime = timeFormat(lapTime); 
        freezeStartTime = Date.now(); 
    }
}

function exportGPX() {
    if (trackLogs.length === 0 && currentLapLog.length === 0) return;
    const all = [...trackLogs, currentLapLog];
    const sessionStartTime = all[0][0]?.time || Date.now();

    let gpx = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="KLAP_ULTIMATE" xmlns="http://www.topografix.com/GPX/1/1" xmlns:gpxtpx="http://www.garmin.com/xmlschemas/TrackPointExtension/v1">`;
    all.forEach((lap, i) => {
        if (lap.length === 0) return;
        gpx += `\n<trk><name>Lap ${i + 1}</name><trkseg>`;
        lap.forEach(p => {
            const relTime = new Date(946684800000 + (p.time - sessionStartTime)).toISOString();
            gpx += `<trkpt lat="${p.lat.toFixed(7)}" lon="${p.lon.toFixed(7)}"><time>${relTime}</time><speed>${(p.speed/3.6).toFixed(2)}</speed><extensions><gpxtpx:TrackPointExtension><gpxtpx:hr>${Math.round(p.rpm)}</gpxtpx:hr><gpxtpx:atemp>${p.temp}</gpxtpx:atemp></gpxtpx:TrackPointExtension></extensions></trkpt>`;
        });
        gpx += `\n</trkseg></trk>`;
    });
    gpx += `\n</gpx>`;
    
    const blob = new Blob([gpx], { type: 'application/gpx+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `RaceLog_${Date.now()}.gpx`; a.click();
}

function timeFormat(ms) {
    let m = Math.floor(ms/60000), s = Math.floor((ms%60000)/1000), mss = Math.floor(ms%1000);
    return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}.${mss.toString().padStart(3,'0')}`;
}

function tick() {
    if (swState !== 1) return;
    const now = Date.now();
    document.getElementById('display').textContent = "TOTAL " + timeFormat(now - startTime);
    if (isFrozen) {
        document.getElementById('display1').textContent = freezeDisplayTime;
        document.getElementById('display1').style.color = "var(--hrc-red)";
        if (now - freezeStartTime > 15000) isFrozen = false;
    } else { 
        document.getElementById('display1').textContent = timeFormat(now - lapStartTime); 
        document.getElementById('display1').style.color = "var(--hrc-white)";
    }
    document.getElementById('max_speed_val').textContent = maxSpeed;
    document.getElementById('rpm_val').textContent = Math.floor(currentRPM);
    requestAnimationFrame(tick);
}

// --- 6. 描画 (Tacho) ---
function drawTacho(rpm) {
    const w = window.innerWidth, h = window.innerHeight;
    if (canvas.width !== w || canvas.height !== h) handleResize();
    ctx.clearRect(0, 0, w, h);

    let rad = 85; if (w > 375) rad = Math.min(160, 85 + (w - 375) * 1.8);
    const sideMargin = 45, topMargin = 60, footerHeight = h * 0.85, barWeight = 48;
    const vLimit = topMargin + rad, totalLen = (footerHeight - vLimit) + (Math.PI * rad / 2) + (w - (sideMargin + rad));
    const activeLen = (rpm / 14000) * totalLen;

    const path = () => {
        ctx.beginPath(); ctx.moveTo(sideMargin, footerHeight); ctx.lineTo(sideMargin, vLimit);
        ctx.arc(sideMargin + rad, vLimit, rad, Math.PI, Math.PI * 1.5); ctx.lineTo(w, topMargin);
    };

    ctx.lineWidth = barWeight; ctx.lineCap = "butt";
    path(); ctx.strokeStyle = "#222"; ctx.stroke();
    ctx.setLineDash([activeLen, totalLen]); ctx.strokeStyle = "#FFF"; ctx.stroke();
    
    const blueS = totalLen * 6000/14000, redS = totalLen * 11000/14000;
    if (activeLen > blueS) { ctx.setLineDash([activeLen - blueS, totalLen]); ctx.lineDashOffset = -blueS; ctx.strokeStyle = "#0055FF"; ctx.stroke(); }
    if (activeLen > redS) { ctx.setLineDash([activeLen - redS, totalLen]); ctx.lineDashOffset = -redS; ctx.strokeStyle = "#FF0000"; ctx.stroke(); }
    ctx.setLineDash([]); ctx.lineDashOffset = 0;
}

// --- 7. UIイベント ---
function handleResize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr; canvas.height = window.innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

document.getElementById('intGpsBtn').onclick = startInternalGps;
document.getElementById('btConnect').onclick = ble;
document.getElementById('saveLogBtn').onclick = exportGPX;
document.getElementById('startBtn').onclick = function() {
    if(swState !== 1) { 
        swState = 1; startTime = Date.now(); lapStartTime = startTime; lastLapTime = 0;
        trackLogs = []; currentLapLog = []; maxSpeed = 0; detectedDirection = null; lastPos = null;
        this.classList.add('active'); document.getElementById('saveLogBtn').style.display = 'none'; tick(); 
    } else { 
        swState = 2; this.classList.remove('active'); document.getElementById('saveLogBtn').style.display = 'flex';
    }
};

document.getElementById('lapBtn').onclick = () => {
    if(swState === 1) processLap(Date.now(), false);
    else if(confirm("RESET?")) location.reload();
};

document.getElementById('reloadBtn').onclick = () => location.reload();
window.onresize = handleResize;

window.onload = () => { 
    handleResize();
    const p1a = localStorage.getItem('startLineP1Lat');
    if (p1a) {
        LAP_LINE_P1 = { lat: parseFloat(p1a), lon: parseFloat(localStorage.getItem('startLineP1Lon')) };
        LAP_LINE_P2 = { lat: parseFloat(localStorage.getItem('startLineP2Lat')), lon: parseFloat(localStorage.getItem('startLineP2Lon')) };
        pulseCount = parseInt(localStorage.getItem('pl1')) || 1;
    }
    (function r(){ drawTacho(currentRPM); requestAnimationFrame(r); })(); 
};
</script>
</body>
</html>
