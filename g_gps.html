<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KLAP DEGI V10.6.1 - PRO FULL</title>
<style>
    :root { --hrc-red: #E4002B; --hrc-blue: #004098; --hrc-white: #ffffff; --hrc-orange: #FFA500; }
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: #000; color: #fff; font-family: 'Arial Black', sans-serif; overflow: hidden; position: fixed; }
    #canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }
    .main-ui-container { position: absolute; left: 0; top: 0; width: 100vw; height: calc(100vh - 60px); z-index: 5; pointer-events: none; }
    #info-overlay { position: absolute; right: 280px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
    #rpm_val { font-size: 13vh; font-weight: 900; line-height: 1.0; color: var(--hrc-white); text-shadow: 2px 2px 10px #000; margin-bottom: 4vh; }
    #display1 { font-size: 17vh; font-weight: 900; line-height: 0.8; text-shadow: 4px 4px 15px #000; white-space: nowrap; }
    #display { font-size: 3vh; color: #888; margin-top: 5px; }
    .right-panels { position: absolute; right: 15px; top: 80px; bottom: 10px; display: flex; gap: 20px; pointer-events: none; }
    #lap-panel { width: 140px; display: flex; flex-direction: column; overflow: hidden; pointer-events: auto; }
    #lap { flex: 1; overflow-y: auto; scrollbar-width: none; }
    .lap-row { display: flex; justify-content: flex-end; gap: 12px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 15px; font-weight: 900; }
    .best-lap { color: var(--hrc-red) !important; }
    .data-panel { display: flex; flex-direction: column; gap: 15px; width: 90px; }
    .data-box { display: flex; flex-direction: column; align-items: flex-end; }
    .label { font-size: 10px; color: var(--hrc-red); font-weight: bold; }
    .val { font-size: 38px; font-weight: 900; line-height: 0.9; }
    #history-page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; padding: 20px; box-sizing: border-box; }
    #history-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    #history-table th { color: var(--hrc-red); border-bottom: 2px solid var(--hrc-red); padding: 10px; font-size: 12px; }
    #history-table td { padding: 10px; border-bottom: 1px solid #333; text-align: center; font-size: 16px; font-weight: bold; }
    .close-btn { background: var(--hrc-red); color: #fff; padding: 15px; text-align: center; font-weight: bold; border-radius: 6px; cursor: pointer; }
    footer { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; display: flex; gap: 4px; padding: 5px; background: #000; z-index: 1000; border-top: 1px solid #333; padding-bottom: env(safe-area-inset-bottom); }
    button { flex: 1; background: #1a1a1a; color: #fff; border: 1px solid #444; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .btn-red { background-color: var(--hrc-red) !important; }
    .btn-orange { background-color: var(--hrc-orange) !important; color: #000 !important; }
    @media screen and (max-width: 667px) { #info-overlay { right: 260px; } }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="main-ui-container">
    <div id="info-overlay">
        <div id="rpm_val">0</div>
        <div id="display1">00:00.000</div>
        <div id="display">TOTAL 00:00.000</div>
    </div>
    <div class="right-panels">
        <div id="lap-panel"><div id="lap"></div></div>
        <div class="data-panel">
            <div class="data-box"><div class="label">SPEED</div><div class="val" id="speed_val">0</div></div>
            <div class="data-box"><div class="label">MAX</div><div class="val" id="max_speed_val" style="color:var(--hrc-orange);">0</div></div>
            <div class="data-box"><div class="label">TEMP</div><div class="val" id="temp_val">--</div></div>
        </div>
    </div>
</div>
<div id="history-page">
    <div class="close-btn" id="historyCloseBtn">CLOSE HISTORY</div>
    <div style="overflow-y: auto; height: calc(100% - 60px);"><table id="history-table"><thead><tr><th>LAP</th><th>TIME</th><th>MAX SPD</th><th>MAX RPM</th></tr></thead><tbody id="history-body"></tbody></table></div>
</div>
    
<footer>
    <button id="intGpsBtn">USB GPS</button>
    <button id="btConnect">BLE START</button>
    <button id="startBtn">TIMER</button>
    <button id="lapBtn">LAP/RESET</button>
    <button id="historyBtn">HISTORY</button>
    <button id="gpxBtn" style="display:none;" class="btn-orange">GPX SAVE</button>
    <button id="reloadBtn" onclick="location.reload()">RELOAD</button>
</footer>

<script>
'use strict';
let currentRPM = 0, currentTemp = 0, currentSpeedKmh = 0, maxSpeedInLap = 0, maxRpmInLap = 0;
let sessionMaxSpeed = 0, sessionMaxRPM = 0, swState = 0, startTime = 0, lapStartTime = 0;
let lapRecords = [], trackPoints = [], lastPos = null, learnedHeading = null, watchId = null;
let isFrozen = false, freezeDisplayTime = "", freezeUntil = 0;
let pulseCount = parseFloat(localStorage.getItem('pl1')) || 1;

// 保存された座標があれば読み込み、なければデフォルト値
// --- 修正後：設定ツールの保存名に合わせる ---
let slLine = { 
    p1: {
        lat: parseFloat(localStorage.getItem('startLineP1Lat')) || 34.825, 
        lng: parseFloat(localStorage.getItem('startLineP1Lon')) || 137.452
    }, 
    p2: {
        lat: parseFloat(localStorage.getItem('startLineP2Lat')) || 34.826, 
        lng: parseFloat(localStorage.getItem('startLineP2Lon')) || 137.453
    } 
};
const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');

function checkLineCross(p1, p2, line) {
    const cross = (a, b, c) => (b.lng - a.lng) * (c.lat - a.lat) - (b.lat - a.lat) * (c.lng - a.lng);
    const s1 = cross(line.p1, line.p2, p1), s2 = cross(line.p1, line.p2, p2);
    if (s1 * s2 < 0) {
        const fraction = Math.abs(s1) / (Math.abs(s1) + Math.abs(s2));
        const estimatedTime = p1.t + (p2.t - p1.t) * fraction;
        const heading = Math.atan2(p2.lng - p1.lng, p2.lat - p1.lat);
        if (learnedHeading === null) { learnedHeading = heading; return estimatedTime; }
        if (Math.abs(heading - learnedHeading) < Math.PI / 2) return estimatedTime;
    }
    return null;
}

function exportGPX() {
    if (trackPoints.length === 0) return;
    let xml = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="KLAP DEGI" xmlns="http://www.topografix.com/GPX/1/1">`;
    xml += `<metadata><desc>SL:${slLine.p1.lat},${slLine.p1.lng}_${slLine.p2.lat},${slLine.p2.lng}</desc></metadata><trk><trkseg>`;
    trackPoints.forEach(p => {
        xml += `<trkpt lat="${p.lat}" lon="${p.lng}"><time>${new Date(p.t).toISOString()}</time><extensions><speed>${p.spd}</speed><rpm>${p.rpm}</rpm></extensions></trkpt>`;
    });
    xml += `</trkseg></trk></gpx>`;
    const blob = new Blob([xml], {type: 'application/gpx+xml'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `V1061_${new Date().getTime()}.gpx`; a.click();
}

function processLap(hitTime, useFreeze, isManual = false) {
    const lapT = hitTime - (lapStartTime || startTime);
   const coolDownLimit = parseInt(localStorage.getItem('lapCoolDownTime')) || 30000;
if (!isManual && lapT < coolDownLimit) return;

    if (maxSpeedInLap > sessionMaxSpeed) sessionMaxSpeed = maxSpeedInLap;
    if (maxRpmInLap > sessionMaxRPM) sessionMaxRPM = maxRpmInLap;

    lapRecords.unshift({ no: lapRecords.length + 1, time: lapT, max: Math.round(maxSpeedInLap), maxRpm: Math.round(maxRpmInLap) });
    const best = Math.min(...lapRecords.map(r => r.time));
    document.getElementById('lap').innerHTML = lapRecords.map(r => `<div class="lap-row ${r.time===best?'best-lap':''}"><span>L${r.no}</span><span>${timeFormat(r.time)}</span></div>`).join('');
    
    lapStartTime = hitTime; maxSpeedInLap = 0; maxRpmInLap = 0;
    if (useFreeze) { isFrozen = true; freezeDisplayTime = timeFormat(lapT); freezeUntil = Date.now() + 15000; }
}

function timeFormat(ms) {
    const m = Math.floor(ms/60000), s = Math.floor((ms%60000)/1000), mss = Math.floor(ms%1000);
    return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}.${mss.toString().padStart(3,'0')}`;
}

function drawTacho(rpm) {
    const w = canvas.width = window.innerWidth, h = canvas.height = window.innerHeight;
    ctx.clearRect(0,0,w,h);
    
    // --- スケール仕様：1000rpm = 4セグメント ---
    const segmentsPer1000 = 4;
    const maxRPM = 14000;
    const seg = (maxRPM / 1000) * segmentsPer1000; // 計56セグメント
    const active = Math.floor((rpm / maxRPM) * seg);
    
    // --- レイアウト設定：正円半径モデル ---
    const sX = 30;          
    const hY = 60;          // 直線部の高さ（上端から）
    const bY = h - 30;      // 開始地点の高さ（下端から）
    const rad = bY - hY;    // 半径を上下の差分で決定
    const rightEnd = w - 20; 
    
    // 距離ベースの分配
    const curveLen = (Math.PI * rad) / 2;
    const lineLen = rightEnd - (sX + rad);
    const totalLen = curveLen + lineLen;
    
    const curveRatio = curveLen / totalLen;
    const cE = Math.round(seg * curveRatio); 
    // ----------------------------

    for (let i = 0; i <= seg; i++) {
        let x, y, ang;
        
        if (i <= cE) {
            // --- 正円アーク部 ---
            const p = i / cE;
            const theta = Math.PI + (p * Math.PI / 2);
            x = sX + rad + Math.cos(theta) * rad;
            y = bY + Math.sin(theta) * rad;
            ang = theta;
        } else {
            // --- 直線部 ---
            const p = (i - cE) / (seg - cE);
            x = (sX + rad) + (p * lineLen);
            y = hY;
            ang = 1.5 * Math.PI;
        }

        if (i < seg) {
            let color = "#222"; 
            const currentRPMVal = (i / seg) * maxRPM;
            
            if (i < active) {
                if (currentRPMVal >= 12500) color = "#E4002B";      
                else if (currentRPMVal >= 8000) color = "#004098";  
                else color = "#FFFFFF";                             
            }
            
            ctx.fillStyle = color;
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(ang + Math.PI / 2);
            
            // --- バーのサイズを元の長さに戻す ---
            // 幅8px, 長さ30px。これが視認性とデザインのバランスが良い標準サイズです。
            ctx.fillRect(-4, -15, 8, 30); 
            
            // 1000回転の区切り（4枚ごと）に少しだけアクセント
            if (i % segmentsPer1000 === 0 && i < active) {
                ctx.shadowBlur = 5;
                ctx.shadowColor = color;
                ctx.fillRect(-4, -15, 8, 30);
            }
            
            ctx.restore();
        }

        // 1000rpmごとのラベル表示
        if (i % segmentsPer1000 === 0) {
            ctx.save();
            ctx.translate(x, y);
            ctx.font = "italic bold 15px Arial";
            ctx.fillStyle = "#888";
            ctx.textAlign = "center";
            
            const dist = 32;
            ctx.fillText(Math.round((i / seg) * 14), Math.cos(ang) * dist, Math.sin(ang) * dist);
            ctx.restore();
        }
    }

    // 数値同期更新
    document.getElementById('rpm_val').textContent = Math.floor(rpm);
    document.getElementById('speed_val').textContent = Math.round(currentSpeedKmh);
    document.getElementById('max_speed_val').textContent = Math.round(Math.max(maxSpeedInLap, sessionMaxSpeed));
    document.getElementById('temp_val').textContent = currentTemp;
}
function tick() {
    const now = Date.now();
    drawTacho(currentRPM);
    if (swState === 1) {
        document.getElementById('display').textContent = "TOTAL " + timeFormat(now - startTime);
        if (isFrozen && now < freezeUntil) {
            document.getElementById('display1').textContent = freezeDisplayTime;
            document.getElementById('display1').style.color = "#E4002B";
        } else {
            isFrozen = false;
            document.getElementById('display1').textContent = timeFormat(now - (lapStartTime || startTime));
            document.getElementById('display1').style.color = "#fff";
        }
    }
    requestAnimationFrame(tick);
}

document.getElementById('intGpsBtn').onclick = () => {
    // 既に起動している場合は停止処理
    if (watchId) { 
        navigator.geolocation.clearWatch(watchId); 
        watchId = null; 
        document.getElementById('intGpsBtn').className = ""; 
        return; 
    }

    // 設定ツールから「GPS閾値」を読み込む（保存されていなければデフォルト20m）
    const gpsThreshold = parseFloat(localStorage.getItem('gpsThreshold')) || 20;

    // ボタンの状態を「スキャン中（オレンジ）」に変更
    document.getElementById('intGpsBtn').className = "btn-orange";

    watchId = navigator.geolocation.watchPosition(pos => {
        // 最初の座標が届いたら「計測中（赤）」に変更
        document.getElementById('intGpsBtn').className = "btn-red";
        
        // 速度計算（m/sからkm/hへ）
        currentSpeedKmh = (pos.coords.speed || 0) * 3.6;
        if (currentSpeedKmh > maxSpeedInLap) maxSpeedInLap = currentSpeedKmh;

        const newP = {
            lat: pos.coords.latitude, 
            lng: pos.coords.longitude, 
            t: Date.now(), 
            spd: currentSpeedKmh, 
            rpm: currentRPM
        };

        // タイマー稼働中（swState===1）のみ通過判定を行う
        if (swState === 1) {
            trackPoints.push(newP);
            
            if (lastPos) {
                // 1. まずスタートライン（P1）との距離をチェック（簡易計算）
                const distP1 = getDistance(newP.lat, newP.lng, slLine.p1.lat, slLine.p1.lng);
                
                // 2. 設定した閾値（例:20m）より遠い場合は判定をスキップ（誤作動防止）
                if (distP1 <= gpsThreshold) {
                    const hit = checkLineCross(lastPos, newP, slLine);
                    if (hit) {
                        // processLap内でも、設定ツールの「クールダウン」が適用されるよう修正済み前提
                        processLap(hit, true, false);
                    }
                }
            }
        }
        lastPos = newP;
    }, 
    (err) => console.error("GPS Error:", err), 
    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
};

// 距離計算用の補助関数（これがないと閾値判定が動かないため、関数の外に追加してください）
function getDistance(lat1, lng1, lat2, lng2) {
    const R = 6371000; // 地球の半径 (m)
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLng / 2) * Math.sin(dLng / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c; // 単位: メートル
}

document.getElementById('btConnect').onclick = async () => {
    try {
        const dev = await navigator.bluetooth.requestDevice({filters:[{services:["4fafc201-1fb5-459e-8fcc-c5c9c331914b"]}]});
        const server = await dev.gatt.connect();
        const service = await server.getPrimaryService("4fafc201-1fb5-459e-8fcc-c5c9c331914b");
        const char = await service.getCharacteristic("f4deb353-a4cf-4ffb-badb-2a5f2e3bb630");
        char.addEventListener('characteristicvaluechanged', (e) => {
            const d = e.target.value;
            if(d.byteLength>=3){
                const hz = d.getUint16(0,true); currentRPM = hz*60/pulseCount;
                currentTemp = d.getUint8(2); document.getElementById('temp_val').textContent = currentTemp;
                if(currentRPM > maxRpmInLap) maxRpmInLap = currentRPM;
                document.getElementById('btConnect').className="btn-red";
            }
        });
        await char.startNotifications();
    } catch(e) { console.error(e); }
};

document.getElementById('startBtn').onclick = () => {
    if(swState!==1){
        swState=1; startTime=Date.now(); lapStartTime=0; lapRecords=[]; trackPoints=[]; learnedHeading=null;
        document.getElementById('gpxBtn').style.display = 'none';
        document.getElementById('startBtn').className = "btn-red";
    } else {
        swState=2;
        document.getElementById('gpxBtn').style.display = 'block';
        document.getElementById('startBtn').className = "";
    }
};

document.getElementById('gpxBtn').onclick = exportGPX;

document.getElementById('lapBtn').onclick = (e) => { 
    e.preventDefault(); 
    if(swState===1) processLap(Date.now(), false, true); 
    else if(confirm("RESET SESSION?")) location.reload();
};

document.getElementById('historyBtn').onclick = () => {
    const best = Math.min(...lapRecords.map(r=>r.time));
    document.getElementById('history-body').innerHTML = lapRecords.map(r=>`
        <tr style="${r.time===best?'background:rgba(228,0,43,0.1);':''}">
            <td>${r.no}</td>
            <td style="${r.time===best?'color:var(--hrc-red);':''}">${timeFormat(r.time)}</td>
            <td>${r.max}</td>
            <td>${r.maxRpm}</td>
        </tr>`).join('');
    document.getElementById('history-page').style.display='block';
};
document.getElementById('historyCloseBtn').onclick=()=>{document.getElementById('history-page').style.display='none';};

window.onload = () => { 
    updateStatusColors(); // ボタンの色をチェック
    tick(); 
};
    // ストレージの入力状況を確認してRELOADボタンの色を変える関数
// 状態（色）を判定し、クリック時の動作を設定する関数
function updateStatusColors() {
    const btn = document.getElementById('reloadBtn');
    if (!btn) return;

    btn.onclick = () => {
        if (confirm("セッションをリセットして再読み込みしますか？")) {
            location.reload();
        }
    };

    // 【ここを修正】設定ツールが保存する名前に変更
    const lat = localStorage.getItem('startLineP1Lat'); 
    const lng = localStorage.getItem('startLineP1Lon');
    
    // どちらかが空ならオレンジ（警告）、両方あれば黒
    const isMissing = (!lat || lat.trim() === "" || !lng || lng.trim() === "");

    if (isMissing) {
        btn.style.backgroundColor = "var(--hrc-orange)";
        btn.style.color = "#000";
    } else {
        btn.style.backgroundColor = "#1a1a1a";
        btn.style.color = "#fff";
    }
}
</script>
</body>
</html>
