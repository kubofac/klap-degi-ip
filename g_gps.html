<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KLAP DEGI V10.6.1 - PRO SEGMENT</title>
<style>
    :root { --hrc-red: #E4002B; --hrc-blue: #004098; --hrc-white: #ffffff; --bg-dark: #000000; --hrc-orange: #FFA500; }
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: #000; color: #fff; font-family: 'Arial Black', sans-serif; overflow: hidden; position: fixed; }
    
    /* タコメーター用キャンバス */
    canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; width: 100vw !important; height: 100vh !important; }

    .main-ui-container { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; }
    
    /* 中央情報表示 */
    #info-overlay { 
        position: absolute; right: 280px; top: 50%; transform: translateY(-50%);
        display: flex; flex-direction: column; align-items: flex-end; text-align: right; 
    }
    #rpm_val { font-size: 13vh; font-weight: 900; line-height: 0.8; color: var(--hrc-white); text-shadow: 2px 2px 10px #000; }
    #display1 { font-size: 17vh; font-weight: 900; line-height: 0.8; text-shadow: 4px 4px 15px #000; white-space: nowrap; }
    #display { font-size: 3.5vh; color: #888; margin-top: 5px; }

    /* 右側パネル */
    .right-panels { position: absolute; right: 15px; top: 80px; bottom: 65px; display: flex; gap: 20px; pointer-events: auto; }
    #lap-panel { width: 140px; display: flex; flex-direction: column; overflow: hidden; }
    #lap { flex: 1; overflow-y: auto; scrollbar-width: none; }
    .lap-row { display: flex; justify-content: flex-end; gap: 12px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 15px; font-weight: 900; }
    .best-lap { color: var(--hrc-red) !important; }

    .data-panel { display: flex; flex-direction: column; gap: 15px; width: 90px; }
    .data-box { display: flex; flex-direction: column; align-items: flex-end; }
    .label { font-size: 10px; color: var(--hrc-red); font-weight: bold; }
    .val { font-size: 38px; font-weight: 900; line-height: 0.9; }

    /* フッター */
    footer { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; display: flex; gap: 3px; padding: 4px; background: #000; z-index: 1000; padding-bottom: env(safe-area-inset-bottom); }
    button { flex: 1; background: #1a1a1a; color: #fff; border: 1px solid #333; border-radius: 6px; font-size: 9px; font-weight: bold; }
    .btn-red { background-color: var(--hrc-red) !important; }
    .btn-orange { background-color: var(--hrc-orange) !important; color: #000; }

    @media screen and (max-width: 667px) { #info-overlay { right: 260px; } }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="main-ui-container">
    <div id="info-overlay">
        <div id="rpm_val">0</div>
        <div id="display1">00:00.000</div>
        <div id="display">TOTAL 00:00.000</div>
    </div>
    
    <div class="right-panels">
        <div id="lap-panel"><div id="lap"></div></div>
        <div class="data-panel">
            <div class="data-box"><div class="label">SPEED</div><div class="val" id="speed_val">0</div></div>
            <div class="data-box"><div class="label">MAX</div><div class="val" id="max_speed_val" style="color:var(--hrc-orange);">0</div></div>
            <div class="data-box"><div class="label">TEMP</div><div class="val" id="temp_val">--</div></div>
        </div>
    </div>
</div>

<footer>
    <button id="intGpsBtn">INT GPS</button>
    <button id="btConnect">BLE START</button>
    <button id="startBtn">TIMER</button>
    <button id="lapBtn">LAP/RESET</button>
    <button id="historyBtn">HISTORY</button>
    <button id="reloadBtn" onclick="location.reload()">RELOAD</button>
</footer>

<script>
'use strict';
let currentRPM = 0, currentTemp = 0, currentSpeedKmh = 0, maxSpeedInLap = 0, maxRpmInLap = 0;
let lastPos = null, lastLapTime = 0, pulseCount = 1, cooldownMs = 15000;
let LAP_LINE_P1 = { lat: 0, lon: 0 }, LAP_LINE_P2 = { lat: 0, lon: 0 };
let swState = 0, startTime = 0, lapStartTime = 0, lapRecords = [];
let lastGpsDataTime = 0, lastBleDataTime = 0, watchId = null;
let isFrozen = false, freezeDisplayTime = "", freezeUntil = 0;
let detectedDirection = null;

const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');

// --- V5.1スタイルのセグメント・タコメーター描画 ---
function drawTacho(rpm) {
    const w = canvas.width = window.innerWidth;
    const h = canvas.height = window.innerHeight;
    ctx.clearRect(0, 0, w, h);

    const segments = 75; // バーの本数
    const activeIdx = Math.floor((rpm / 14000) * segments);
    
    // レイアウト設定
    const sX = 25; // 開始X
    const hY = 45; // 上部ラインY
    const bY = h - 20; // 下部開始Y
    const rad = bY - hY; // カーブ半径
    const curveEnd = 30; // カーブ区間のセグメント数

    for (let i = 0; i <= segments; i++) {
        let x, y, ang, prog;
        
        if (i <= curveEnd) {
            // カーブ区間（左下から左上へ）
            prog = i / curveEnd;
            ang = Math.PI + (prog * (Math.PI / 2));
            x = sX + rad + Math.cos(ang) * rad;
            y = bY + Math.sin(ang) * rad;
        } else {
            // 直線区間（左から右へ）
            prog = (i - curveEnd) / (segments - curveEnd);
            x = (sX + rad) + (prog * (w - (sX + rad) - 40));
            y = hY;
            ang = 1.5 * Math.PI;
        }

        if (i < segments) {
            const currentRpmAtIdx = (i / segments) * 14000;
            
            // 色決定 (V5.1仕様)
            if (i < activeIdx) {
                if (currentRpmAtIdx >= 12500) ctx.fillStyle = "var(--hrc-red)";
                else if (currentRpmAtIdx >= 8000) ctx.fillStyle = "var(--hrc-blue)";
                else ctx.fillStyle = "#ffffff";
            } else {
                ctx.fillStyle = "#222"; // 未到達
            }

            // バーの描画
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(ang + Math.PI / 2);
            // セグメントの太さと長さを調整
            const barW = Math.max(4, w * 0.012);
            const barH = Math.max(25, h * 0.12);
            ctx.fillRect(-barW/2, -barH/2, barW, barH);
            ctx.restore();
        }
    }
}

// --- 計測エンジン (V10.6.1仕様) ---
function handlePositionUpdate(lat, lon, now) {
    if (swState !== 1) return;
    if (currentSpeedKmh > maxSpeedInLap) maxSpeedInLap = currentSpeedKmh;
    if (currentRPM > maxRpmInLap) maxRpmInLap = currentRPM;

    if (lastPos && LAP_LINE_P1.lat !== 0) {
        const x1 = lastPos.lon, y1 = lastPos.lat, x2 = lon, y2 = lat;
        const x3 = LAP_LINE_P1.lon, y3 = LAP_LINE_P1.lat, x4 = LAP_LINE_P2.lon, y4 = LAP_LINE_P2.lat;
        const den = (y4-y3)*(x2-x1) - (x4-x3)*(y2-y1);
        if (Math.abs(den) > 1e-12) {
            const t = ((x4-x3)*(y1-y3)-(y4-y3)*(x1-x3))/den;
            const u = ((x2-x1)*(y1-y3)-(y2-y1)*(x1-x3))/den;
            if (t>=0 && t<=1 && u>=-0.2 && u<=1.2) {
                const hitT = lastPos.time + (now - lastPos.time)*t;
                const dir = den > 0 ? 1 : -1;
                if (detectedDirection === null) detectedDirection = dir;
                if (dir === detectedDirection && (hitT - lastLapTime > cooldownMs)) {
                    processLap(hitT, true);
                }
            }
        }
    }
    lastPos = { lat, lon, time: now };
}

function processLap(hitTime, useFreeze) {
    const lapT = hitTime - (lapStartTime || startTime);
    if (lapT < 2000) return;

    lapRecords.unshift({ no: lapRecords.length+1, time: lapT });
    const best = Math.min(...lapRecords.map(r => r.time));
    document.getElementById('lap').innerHTML = lapRecords.map(r => `<div class="lap-row ${r.time===best?'best-lap':''}"><span>L${r.no}</span><span>${timeFormat(r.time)}</span></div>`).join('');
    
    lapStartTime = hitTime; lastLapTime = hitTime;
    if (useFreeze) { isFrozen = true; freezeDisplayTime = timeFormat(lapT); freezeUntil = Date.now() + 15000; }
}

function timeFormat(ms) {
    const m = Math.floor(ms/60000), s = Math.floor((ms%60000)/1000), mss = Math.floor(ms%1000);
    return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}.${mss.toString().padStart(3,'0')}`;
}

function tick() {
    const now = Date.now();
    drawTacho(currentRPM);
    document.getElementById('rpm_val').textContent = Math.floor(currentRPM);
    document.getElementById('speed_val').textContent = Math.round(currentSpeedKmh);

    if (swState === 1) {
        document.getElementById('display').textContent = "TOTAL " + timeFormat(now - startTime);
        if (isFrozen && now < freezeUntil) {
            document.getElementById('display1').textContent = freezeDisplayTime;
            document.getElementById('display1').style.color = "var(--hrc-red)";
        } else {
            isFrozen = false;
            document.getElementById('display1').textContent = timeFormat(now - (lapStartTime || startTime));
            document.getElementById('display1').style.color = "#fff";
        }
    }

    // ボタン色同期
    const gBtn = document.getElementById('intGpsBtn');
    if (lastGpsDataTime > 0 && (now - lastGpsDataTime < 3000)) gBtn.className = "btn-red";
    else if (watchId) gBtn.className = "btn-orange";
    if (lastBleDataTime > 0 && (now - lastBleDataTime < 2000)) document.getElementById('btConnect').className = "btn-red";
    document.getElementById('startBtn').className = (swState === 1) ? "btn-red" : "";

    requestAnimationFrame(tick);
}

// 通信処理
document.getElementById('intGpsBtn').onclick = () => {
    if (watchId) return;
    watchId = navigator.geolocation.watchPosition(pos => {
        lastGpsDataTime = Date.now();
        currentSpeedKmh = pos.coords.speed ? pos.coords.speed * 3.6 : 0;
        handlePositionUpdate(pos.coords.latitude, pos.coords.longitude, Date.now());
    }, null, { enableHighAccuracy: true });
};

document.getElementById('btConnect').onclick = async () => {
    try {
        const device = await navigator.bluetooth.requestDevice({ filters: [{ services: ["4fafc201-1fb5-459e-8fcc-c5c9c331914b"] }] });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService("4fafc201-1fb5-459e-8fcc-c5c9c331914b");
        const char = await service.getCharacteristic("f4deb353-a4cf-4ffb-badb-2a5f2e3bb630");
        char.addEventListener('characteristicvaluechanged', (e) => {
            lastBleDataTime = Date.now();
            const d = e.target.value;
            if (d.byteLength >= 13) {
                currentRPM = (d.getUint16(11, true) * 60) / pulseCount;
                currentTemp = d.getUint8(10);
                document.getElementById('temp_val').textContent = currentTemp;
            }
        });
        await char.startNotifications();
    } catch (e) { console.log(e); }
};

document.getElementById('startBtn').onclick = function() {
    if (swState !== 1) { swState = 1; startTime = Date.now(); lapStartTime = 0; lapRecords = []; }
    else { swState = 2; }
};

document.getElementById('lapBtn').onclick = () => { if(swState===1) processLap(Date.now(), false); };

window.onload = () => {
    const p1a = localStorage.getItem('startLineP1Lat');
    if (p1a) {
        LAP_LINE_P1 = { lat: parseFloat(p1a), lon: parseFloat(localStorage.getItem('startLineP1Lon')) };
        LAP_LINE_P2 = { lat: parseFloat(localStorage.getItem('startLineP2Lat')), lon: parseFloat(localStorage.getItem('startLineP2Lon')) };
    }
    pulseCount = parseFloat(localStorage.getItem('pl1')) || 1;
    cooldownMs = parseInt(localStorage.getItem('lapCoolDownTime')) || 15000;
    tick();
};
</script>
</body>
</html>
